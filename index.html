<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WebEditor</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/theme/monokai.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/dialog/dialog.min.css">
  <style>
    :root {
      --bg:#1e1e1e; --bg2:#252526; --bg3:#2d2d2d;
      --border:#333; --text:#ccc; --text2:#888;
      --accent:#569cd6; --dirty:#e07b00;
      --tab-active:#1e1e1e; --tab-inactive:#2d2d30;
      --status:#007acc;
    }
    [data-theme="light"] {
      --bg:#fff; --bg2:#f3f3f3; --bg3:#ebebeb;
      --border:#e0e0e0; --text:#1b1b1b; --text2:#727272;
      --accent:#343ced; --tab-active:#fff; --tab-inactive:#f0f0f0;
      --status:#343ced;
    }
    *{box-sizing:border-box;margin:0;padding:0}
    html,body{height:100%;overflow:hidden}
    body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;font-size:13px;background:var(--bg);color:var(--text);display:flex;flex-direction:column}

    /* topbar */
    #topbar{height:40px;background:var(--bg2);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 10px;gap:4px;flex-shrink:0;user-select:none}
    #app-name{font-weight:600;font-size:13px;margin-right:6px;color:var(--text)}
    .tbtn{background:none;border:none;color:var(--text2);cursor:pointer;padding:4px 8px;border-radius:4px;font-size:12px;display:flex;align-items:center;gap:4px;transition:background .12s,color .12s;white-space:nowrap}
    .tbtn:hover{background:var(--bg3);color:var(--text)}
    .tdiv{width:1px;height:18px;background:var(--border);flex-shrink:0;margin:0 2px}
    #topbar-right{margin-left:auto;display:flex;align-items:center;gap:2px}

    /* main layout */
    #main{display:flex;flex:1;overflow:hidden}

    /* sidebar */
    #sidebar{width:220px;min-width:120px;max-width:450px;background:var(--bg2);border-right:1px solid var(--border);display:flex;flex-direction:column;overflow:hidden;flex-shrink:0}
    #sidebar-hdr{padding:7px 10px;font-size:10.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--text2);display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--border);flex-shrink:0}
    #sidebar-actions{display:flex;gap:1px}
    .ibtn{background:none;border:none;color:var(--text2);cursor:pointer;width:22px;height:22px;border-radius:3px;display:flex;align-items:center;justify-content:center;font-size:13px;transition:background .12s,color .12s}
    .ibtn:hover{background:var(--bg3);color:var(--text)}
    #file-tree{flex:1;overflow-y:auto;padding:3px 0}
    .tree-item{display:flex;align-items:center;padding:3px 8px;cursor:pointer;border-radius:3px;margin:0 3px;gap:5px;white-space:nowrap;overflow:hidden;color:var(--text);user-select:none}
    .tree-item:hover{background:var(--bg3)}
    .tree-item.active{background:var(--accent);color:#fff}
    .tree-item.active .ti-icon{color:#fff}
    .ti-icon{font-size:12px;color:var(--text2);flex-shrink:0}
    .ti-name{flex:1;overflow:hidden;text-overflow:ellipsis;font-size:12.5px}
    .tree-children{padding-left:12px}
    #rhandle{width:4px;cursor:col-resize;background:transparent;flex-shrink:0;transition:background .2s}
    #rhandle:hover,#rhandle.dragging{background:var(--accent)}

    /* editor area */
    #editor-area{flex:1;display:flex;flex-direction:column;overflow:hidden}
    #tab-bar{height:34px;background:var(--bg2);border-bottom:1px solid var(--border);display:flex;align-items:flex-end;overflow-x:auto;overflow-y:hidden;flex-shrink:0}
    #tab-bar::-webkit-scrollbar{height:3px}
    #tab-bar::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px}
    .tab{display:flex;align-items:center;gap:5px;padding:0 11px;height:31px;cursor:pointer;border:1px solid transparent;border-bottom:none;border-radius:4px 4px 0 0;background:var(--tab-inactive);color:var(--text2);white-space:nowrap;font-size:12px;flex-shrink:0;transition:background .1s,color .1s;user-select:none}
    .tab.active{background:var(--tab-active);color:var(--text);border-color:var(--border)}
    .tab:hover:not(.active){background:var(--bg3);color:var(--text)}
    .tab-dot{width:6px;height:6px;border-radius:50%;background:var(--dirty);flex-shrink:0}
    .tab-x{background:none;border:none;color:var(--text2);cursor:pointer;width:15px;height:15px;border-radius:2px;display:flex;align-items:center;justify-content:center;font-size:11px;transition:background .1s}
    .tab-x:hover{background:rgba(127,127,127,.25);color:var(--text)}
    .tab-new-btn{background:none;border:none;color:var(--text2);cursor:pointer;padding:0 10px;height:31px;font-size:18px;display:flex;align-items:center;transition:color .1s;flex-shrink:0}
    .tab-new-btn:hover{color:var(--text)}
    #editor-wrap{flex:1;overflow:hidden;position:relative}
    .CodeMirror{height:100%!important;font-size:14px;font-family:'JetBrains Mono','Fira Code','Cascadia Code',Consolas,monospace;line-height:1.6}
    #empty-state{position:absolute;inset:0;z-index:10;display:flex;flex-direction:column;align-items:center;justify-content:center;background:var(--bg);color:var(--text2);gap:10px;pointer-events:none}
    #empty-state .esi{font-size:36px;opacity:.25}
    #drag-overlay{position:absolute;inset:0;background:rgba(52,60,237,.08);border:2px dashed var(--accent);display:none;align-items:center;justify-content:center;z-index:50;pointer-events:none}
    #drag-overlay.show{display:flex}
    #drag-overlay p{font-size:15px;color:var(--accent);font-weight:500}

    /* find bar */
    #find-bar{border-top:1px solid var(--border);background:var(--bg2);padding:5px 10px;display:none;align-items:center;gap:6px;flex-shrink:0}
    #find-bar.show{display:flex}
    .finput{background:var(--bg);border:1px solid var(--border);color:var(--text);padding:3px 8px;border-radius:4px;font-size:12px;width:180px;outline:none;font-family:inherit}
    .finput:focus{border-color:var(--accent)}
    .fbtn{background:var(--bg3);border:1px solid var(--border);color:var(--text);padding:3px 8px;border-radius:4px;font-size:12px;cursor:pointer}
    .fbtn:hover{background:var(--border)}
    #find-count{font-size:11px;color:var(--text2);min-width:70px}
    #find-close{margin-left:auto;background:none;border:none;color:var(--text2);cursor:pointer;font-size:15px;padding:2px 5px;border-radius:3px}
    #find-close:hover{background:var(--bg3);color:var(--text)}

    /* status bar */
    #status-bar{height:22px;background:var(--status);color:rgba(255,255,255,.9);display:flex;align-items:center;padding:0 10px;font-size:11px;gap:14px;flex-shrink:0}
    #status-msg{margin-left:auto}
    #status-msg.err{color:#ff9090}

    /* context menu */
    #ctx-menu{position:fixed;background:var(--bg);border:1px solid var(--border);border-radius:6px;box-shadow:0 4px 16px rgba(0,0,0,.25);z-index:900;display:none;min-width:160px;padding:4px 0}
    #ctx-menu.show{display:block}
    .ctx-item{padding:6px 14px;cursor:pointer;font-size:12px;color:var(--text);transition:background .1s}
    .ctx-item:hover{background:var(--bg3)}
    .ctx-item.danger{color:#e05252}
    .ctx-sep{height:1px;background:var(--border);margin:3px 0}

    /* modal */
    .modal-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:1000;display:none;align-items:center;justify-content:center}
    .modal-backdrop.show{display:flex}
    .modal{background:var(--bg2);border:1px solid var(--border);border-radius:8px;padding:20px;min-width:340px;max-width:500px;width:90%}
    .modal h3{margin-bottom:14px;font-size:14px;color:var(--text)}
    .modal label{display:block;font-size:12px;color:var(--text2);margin-bottom:4px;margin-top:10px}
    .modal input{width:100%;background:var(--bg);border:1px solid var(--border);color:var(--text);padding:6px 10px;border-radius:4px;font-size:13px;outline:none;font-family:inherit}
    .modal input:focus{border-color:var(--accent)}
    .modal-btns{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}
    .mbtn{padding:6px 14px;border-radius:4px;font-size:12px;cursor:pointer;border:none}
    .mbtn-pri{background:var(--accent);color:#fff}
    .mbtn-sec{background:var(--bg3);color:var(--text);border:1px solid var(--border)}
  </style>
</head>
<body>
<div id="topbar">
  <span id="app-name">&#9998; WebEditor</span>
  <div class="tdiv"></div>
  <button class="tbtn" onclick="newFile()">&#43; New</button>
  <button class="tbtn" onclick="openFilePicker()">&#128194; Open</button>
  <button class="tbtn" onclick="downloadActive()">&#8659; Download</button>
  <div class="tdiv"></div>
  <button class="tbtn" onclick="saveToGist()">&#9729; Save Gist</button>
  <button class="tbtn" onclick="openLoadGistModal()">&#8615; Load Gist</button>
  <div id="topbar-right">
    <button class="tbtn" onclick="toggleTheme()">&#9790; Theme</button>
    <button class="tbtn" onclick="openSettings()">&#9881; Settings</button>
  </div>
</div>

<div id="main">
  <div id="sidebar">
    <div id="sidebar-hdr">
      Files
      <div id="sidebar-actions">
        <button class="ibtn" title="New file" onclick="newFile()">&#43;</button>
        <button class="ibtn" title="New folder" onclick="newFolder()">&#128193;</button>
      </div>
    </div>
    <div id="file-tree"></div>
  </div>
  <div id="rhandle"></div>
  <div id="editor-area">
    <div id="tab-bar">
      <button class="tab-new-btn" onclick="newFile()" title="New tab">+</button>
    </div>
    <div id="editor-wrap">
      <div id="empty-state">
        <div class="esi">&#9998;</div>
        <p>Open or create a file to start editing</p>
        <p style="font-size:11px">Drag a file here to open it</p>
      </div>
      <div id="drag-overlay"><p>Drop to open</p></div>
      <textarea id="cm-host"></textarea>
    </div>
    <div id="find-bar">
      <span style="font-size:11px;color:var(--text2)">Find</span>
      <input class="finput" id="find-input" placeholder="Search...">
      <span style="font-size:11px;color:var(--text2)">Replace</span>
      <input class="finput" id="replace-input" placeholder="Replace...">
      <button class="fbtn" onclick="findPrev()">&#8593;</button>
      <button class="fbtn" onclick="findNext()">&#8595;</button>
      <button class="fbtn" onclick="replaceOne()">Replace</button>
      <button class="fbtn" onclick="replaceAll()">All</button>
      <span id="find-count"></span>
      <button id="find-close" onclick="closeFind()">&#10005;</button>
    </div>
  </div>
</div>

<div id="status-bar">
  <span id="st-lang">Plain Text</span>
  <span id="st-pos">Ln 1, Col 1</span>
  <span id="status-msg"></span>
</div>

<div id="ctx-menu">
  <div class="ctx-item" id="ctx-rename">Rename</div>
  <div class="ctx-item" id="ctx-download">Download</div>
  <div class="ctx-sep"></div>
  <div class="ctx-item danger" id="ctx-delete">Delete</div>
</div>

<!-- Settings modal -->
<div class="modal-backdrop" id="settings-modal">
  <div class="modal">
    <h3>Settings</h3>
    <label>GitHub Personal Access Token (gist scope)</label>
    <input type="password" id="pat-input" placeholder="ghp_...">
    <div class="modal-btns">
      <button class="mbtn mbtn-sec" onclick="closeSettings()">Cancel</button>
      <button class="mbtn mbtn-pri" onclick="saveSettings()">Save</button>
    </div>
  </div>
</div>

<!-- Load Gist modal -->
<div class="modal-backdrop" id="gist-modal">
  <div class="modal">
    <h3>Load Gist</h3>
    <label>Gist ID or URL</label>
    <input type="text" id="gist-input" placeholder="https://gist.github.com/user/abc123 or abc123">
    <div class="modal-btns">
      <button class="mbtn mbtn-sec" onclick="closeGistModal()">Cancel</button>
      <button class="mbtn mbtn-pri" onclick="loadGist()">Load</button>
    </div>
  </div>
</div>

<!-- Rename modal -->
<div class="modal-backdrop" id="rename-modal">
  <div class="modal">
    <h3>Rename</h3>
    <label>New name</label>
    <input type="text" id="rename-input">
    <div class="modal-btns">
      <button class="mbtn mbtn-sec" onclick="closeRenameModal()">Cancel</button>
      <button class="mbtn mbtn-pri" onclick="confirmRename()">Rename</button>
    </div>
  </div>
</div>

<!-- CodeMirror 5 -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/javascript/javascript.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/xml/xml.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/css/css.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/htmlmixed/htmlmixed.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/python/python.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/sql/sql.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/markdown/markdown.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/yaml/yaml.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/shell/shell.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/php/php.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/search/search.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/search/searchcursor.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/edit/matchbrackets.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/edit/closebrackets.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/scroll/simplescrollbars.min.js"></script>

<script>
// ── IDB helper ────────────────────────────────────────────────────────────────
const DB_NAME = 'webeditor', DB_VER = 1;
let db;
function openDB() {
  return new Promise((res, rej) => {
    const req = indexedDB.open(DB_NAME, DB_VER);
    req.onupgradeneeded = e => {
      const d = e.target.result;
      if (!d.objectStoreNames.contains('files')) d.createObjectStore('files', {keyPath:'id'});
      if (!d.objectStoreNames.contains('meta'))  d.createObjectStore('meta',  {keyPath:'key'});
    };
    req.onsuccess = e => { db = e.target.result; res(db); };
    req.onerror   = () => rej(req.error);
  });
}
function dbPut(store, val) {
  return new Promise((res,rej)=>{const tx=db.transaction(store,'readwrite');tx.objectStore(store).put(val);tx.oncomplete=res;tx.onerror=()=>rej(tx.error);});
}
function dbGet(store, key) {
  return new Promise((res,rej)=>{const tx=db.transaction(store,'readonly');const req=tx.objectStore(store).get(key);req.onsuccess=()=>res(req.result);req.onerror=()=>rej(req.error);});
}
function dbGetAll(store) {
  return new Promise((res,rej)=>{const tx=db.transaction(store,'readonly');const req=tx.objectStore(store).getAll();req.onsuccess=()=>res(req.result);req.onerror=()=>rej(req.error);});
}
function dbDelete(store, key) {
  return new Promise((res,rej)=>{const tx=db.transaction(store,'readwrite');tx.objectStore(store).delete(key);tx.oncomplete=res;tx.onerror=()=>rej(tx.error);});
}

// ── State ─────────────────────────────────────────────────────────────────────
let files = {};       // id -> {id, name, parentId, isFolder, content, gistId, gistFileId}
let tabs  = [];       // [{fileId, dirty}]
let activeTab = -1;
let cm;               // CodeMirror instance
let ctxTarget = null; // file id for context menu
let renameTarget = null;

// ── Language detection ────────────────────────────────────────────────────────
const MODES = {
  js:'javascript', mjs:'javascript', cjs:'javascript',
  ts:'javascript', tsx:'javascript', jsx:'javascript',
  html:'htmlmixed', htm:'htmlmixed',
  css:'css', scss:'css', less:'css',
  py:'python',
  sql:'sql',
  md:'markdown', markdown:'markdown',
  yaml:'yaml', yml:'yaml',
  sh:'shell', bash:'shell', zsh:'shell',
  php:'php',
  json:'javascript',
  xml:'xml',
};
const LANG_NAMES = {
  javascript:'JavaScript', htmlmixed:'HTML', css:'CSS',
  python:'Python', sql:'SQL', markdown:'Markdown',
  yaml:'YAML', shell:'Shell', php:'PHP', xml:'XML',
};
function getLang(name) {
  const ext = (name||'').split('.').pop().toLowerCase();
  return MODES[ext] || 'null';
}
function getLangName(name) {
  return LANG_NAMES[getLang(name)] || 'Plain Text';
}

// ── CodeMirror init ───────────────────────────────────────────────────────────
function initCM() {
  cm = CodeMirror.fromTextArea(document.getElementById('cm-host'), {
    lineNumbers: true,
    matchBrackets: true,
    autoCloseBrackets: true,
    theme: document.documentElement.dataset.theme === 'dark' ? 'monokai' : 'default',
    indentUnit: 2,
    tabSize: 2,
    indentWithTabs: false,
    lineWrapping: false,
    extraKeys: {
      'Ctrl-F': openFind,
      'Cmd-F':  openFind,
      'Ctrl-S': ()=>{ autoSave(); },
      'Cmd-S':  ()=>{ autoSave(); },
    }
  });
  cm.on('change', () => markDirty());
  cm.on('cursorActivity', updatePos);
}

function updatePos() {
  const c = cm.getCursor();
  document.getElementById('st-pos').textContent = `Ln ${c.line+1}, Col ${c.ch+1}`;
}

// ── File tree ─────────────────────────────────────────────────────────────────
function renderTree() {
  const tree = document.getElementById('file-tree');
  tree.innerHTML = '';
  const roots = Object.values(files).filter(f=>!f.parentId).sort(sortFiles);
  roots.forEach(f => tree.appendChild(buildTreeItem(f)));
}

function sortFiles(a,b) {
  if (a.isFolder && !b.isFolder) return -1;
  if (!a.isFolder && b.isFolder) return 1;
  return a.name.localeCompare(b.name);
}

function buildTreeItem(f, depth=0) {
  const wrap = document.createElement('div');
  const item = document.createElement('div');
  item.className = 'tree-item';
  item.style.paddingLeft = (8 + depth*12) + 'px';
  const activeFile = tabs[activeTab]?.fileId;
  if (!f.isFolder && f.id === activeFile) item.classList.add('active');

  item.innerHTML = `<span class="ti-icon">${f.isFolder ? '&#128193;' : fileIcon(f.name)}</span><span class="ti-name">${esc(f.name)}</span>`;
  if (!f.isFolder) {
    item.onclick = () => openFileTab(f.id);
  } else {
    item.onclick = () => toggleFolder(f.id, wrap);
  }
  item.addEventListener('contextmenu', e => { e.preventDefault(); showCtx(e, f.id); });
  wrap.appendChild(item);

  if (f.isFolder) {
    const children = document.createElement('div');
    children.className = 'tree-children';
    children.dataset.folderId = f.id;
    const kids = Object.values(files).filter(c=>c.parentId===f.id).sort(sortFiles);
    kids.forEach(k => children.appendChild(buildTreeItem(k, depth+1)));
    wrap.appendChild(children);
  }
  return wrap;
}

function toggleFolder(id, wrap) {
  const ch = wrap.querySelector('.tree-children');
  if (ch) ch.style.display = ch.style.display === 'none' ? '' : 'none';
}

function fileIcon(name) {
  const ext = (name||'').split('.').pop().toLowerCase();
  const icons = {js:'&#128196;',ts:'&#128196;',html:'&#127760;',css:'&#127912;',py:'&#128013;',md:'&#128209;',json:'&#123;',sql:'&#128200;',sh:'&#128187;'};
  return icons[ext] || '&#128196;';
}

function esc(s) { return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

// ── Tabs ──────────────────────────────────────────────────────────────────────
function renderTabs() {
  const bar = document.getElementById('tab-bar');
  bar.innerHTML = '';
  tabs.forEach((t,i) => {
    const f = files[t.fileId];
    const div = document.createElement('div');
    div.className = 'tab' + (i===activeTab?' active':'');
    div.innerHTML = `${t.dirty?'<span class="tab-dot"></span>':''}${esc(f?.name||'Untitled')}<button class="tab-x" title="Close">&#10005;</button>`;
    div.onclick = e => { if (!e.target.classList.contains('tab-x')) switchTab(i); };
    div.querySelector('.tab-x').onclick = e => { e.stopPropagation(); closeTab(i); };
    bar.appendChild(div);
  });
  const nb = document.createElement('button');
  nb.className = 'tab-new-btn';
  nb.textContent = '+';
  nb.onclick = newFile;
  bar.appendChild(nb);
}

function switchTab(i) {
  if (i === activeTab) return;
  autoSave();
  activeTab = i;
  loadTabContent();
}

function loadTabContent() {
  const t = tabs[activeTab];
  if (!t) { showEmpty(true); return; }
  const f = files[t.fileId];
  if (!f) { showEmpty(true); return; }
  showEmpty(false);
  cm.setValue(f.content || '');
  cm.setOption('mode', getLang(f.name));
  cm.clearHistory();
  document.getElementById('st-lang').textContent = getLangName(f.name);
  renderTabs();
  renderTree();
  setTimeout(()=>{ cm.refresh(); cm.focus(); }, 30);
}

function showEmpty(yes) {
  document.getElementById('empty-state').style.display = yes ? '' : 'none';
}

function openFileTab(fileId) {
  const existing = tabs.findIndex(t=>t.fileId===fileId);
  if (existing >= 0) { switchTab(existing); return; }
  autoSave();
  tabs.push({fileId, dirty:false});
  activeTab = tabs.length - 1;
  loadTabContent();
}

function closeTab(i) {
  if (tabs[i]?.dirty) autoSave();
  tabs.splice(i,1);
  if (activeTab >= tabs.length) activeTab = tabs.length - 1;
  if (tabs.length === 0) { showEmpty(true); renderTabs(); renderTree(); return; }
  loadTabContent();
}

function markDirty() {
  if (activeTab < 0) return;
  if (!tabs[activeTab].dirty) { tabs[activeTab].dirty = true; renderTabs(); }
}

// ── File ops ──────────────────────────────────────────────────────────────────
function uid() { return Date.now().toString(36)+Math.random().toString(36).slice(2); }

async function newFile(parentId=null, defaultName='untitled.txt') {
  const name = prompt('File name:', defaultName);
  if (!name) return;
  const f = {id:uid(), name, parentId, isFolder:false, content:'', gistId:null, gistFileId:null};
  files[f.id] = f;
  await dbPut('files', f);
  renderTree();
  openFileTab(f.id);
}

async function newFolder(parentId=null) {
  const name = prompt('Folder name:', 'New Folder');
  if (!name) return;
  const f = {id:uid(), name, parentId, isFolder:true, content:''};
  files[f.id] = f;
  await dbPut('files', f);
  renderTree();
}

function openFilePicker() {
  const inp = document.createElement('input');
  inp.type = 'file';
  inp.multiple = true;
  inp.onchange = async () => {
    for (const file of inp.files) {
      const text = await file.text();
      const f = {id:uid(), name:file.name, parentId:null, isFolder:false, content:text, gistId:null, gistFileId:null};
      files[f.id] = f;
      await dbPut('files', f);
      renderTree();
      openFileTab(f.id);
    }
  };
  inp.click();
}

function downloadActive() {
  if (activeTab < 0) return;
  autoSave();
  const f = files[tabs[activeTab].fileId];
  if (!f) return;
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([f.content], {type:'text/plain'}));
  a.download = f.name;
  a.click();
}

async function autoSave() {
  if (activeTab < 0) return;
  const t = tabs[activeTab];
  if (!t) return;
  const f = files[t.fileId];
  if (!f || f.isFolder) return;
  f.content = cm.getValue();
  t.dirty = false;
  await dbPut('files', f);
  await persistSession();
  renderTabs();
}

async function persistSession() {
  await dbPut('meta', {key:'session', tabs: tabs.map(t=>t.fileId), activeTab});
}

// ── Context menu ──────────────────────────────────────────────────────────────
function showCtx(e, fileId) {
  ctxTarget = fileId;
  const m = document.getElementById('ctx-menu');
  m.style.left = e.clientX + 'px';
  m.style.top  = e.clientY + 'px';
  m.classList.add('show');
}
function hideCtx() { document.getElementById('ctx-menu').classList.remove('show'); }
document.addEventListener('click', hideCtx);
document.getElementById('ctx-rename').onclick = () => { if(ctxTarget) openRenameModal(ctxTarget); };
document.getElementById('ctx-download').onclick = () => {
  if (!ctxTarget) return;
  const f = files[ctxTarget];
  if (!f || f.isFolder) return;
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([f.content],{type:'text/plain'}));
  a.download = f.name;
  a.click();
};
document.getElementById('ctx-delete').onclick = async () => {
  if (!ctxTarget) return;
  if (!confirm('Delete "'+files[ctxTarget]?.name+'"?')) return;
  const id = ctxTarget;
  const ti = tabs.findIndex(t=>t.fileId===id);
  if (ti>=0) closeTab(ti);
  delete files[id];
  await dbDelete('files', id);
  renderTree();
};

// ── Rename ────────────────────────────────────────────────────────────────────
function openRenameModal(id) {
  renameTarget = id;
  document.getElementById('rename-input').value = files[id]?.name || '';
  document.getElementById('rename-modal').classList.add('show');
  setTimeout(()=>document.getElementById('rename-input').select(),50);
}
function closeRenameModal() { document.getElementById('rename-modal').classList.remove('show'); renameTarget=null; }
async function confirmRename() {
  if (!renameTarget) return;
  const name = document.getElementById('rename-input').value.trim();
  if (!name) return;
  files[renameTarget].name = name;
  await dbPut('files', files[renameTarget]);
  closeRenameModal();
  renderTree();
  renderTabs();
  if (tabs[activeTab]?.fileId === renameTarget) {
    cm.setOption('mode', getLang(name));
    document.getElementById('st-lang').textContent = getLangName(name);
  }
}
document.getElementById('rename-input').addEventListener('keydown', e => { if(e.key==='Enter') confirmRename(); if(e.key==='Escape') closeRenameModal(); });

// ── Drag and drop ─────────────────────────────────────────────────────────────
const wrap = document.getElementById('editor-wrap');
wrap.addEventListener('dragover', e => { e.preventDefault(); document.getElementById('drag-overlay').classList.add('show'); });
wrap.addEventListener('dragleave', () => document.getElementById('drag-overlay').classList.remove('show'));
wrap.addEventListener('drop', async e => {
  e.preventDefault();
  document.getElementById('drag-overlay').classList.remove('show');
  for (const file of e.dataTransfer.files) {
    const text = await file.text();
    const f = {id:uid(), name:file.name, parentId:null, isFolder:false, content:text, gistId:null, gistFileId:null};
    files[f.id] = f;
    await dbPut('files', f);
    renderTree();
    openFileTab(f.id);
  }
});

// ── Find / Replace ────────────────────────────────────────────────────────────
let findMatches = [], findIdx = 0;
function openFind() {
  document.getElementById('find-bar').classList.add('show');
  document.getElementById('find-input').focus();
}
function closeFind() {
  document.getElementById('find-bar').classList.remove('show');
  cm.focus();
  clearMarks();
}
function clearMarks() {
  cm.getAllMarks().forEach(m=>m.clear());
  findMatches=[];
  document.getElementById('find-count').textContent='';
}
function doSearch() {
  clearMarks();
  const q = document.getElementById('find-input').value;
  if (!q) return;
  const cur = cm.getSearchCursor(q);
  while (cur.findNext()) {
    const m = cm.markText(cur.from(), cur.to(), {className:'cm-searching'});
    findMatches.push({from:cur.from(), to:cur.to(), mark:m});
  }
  document.getElementById('find-count').textContent = findMatches.length + ' results';
  if (findMatches.length) { findIdx=0; cm.scrollIntoView(findMatches[0]); }
}
function findNext() { if(!findMatches.length){doSearch();return;} findIdx=(findIdx+1)%findMatches.length; cm.scrollIntoView(findMatches[findIdx]); }
function findPrev() { if(!findMatches.length){doSearch();return;} findIdx=(findIdx+findMatches.length-1)%findMatches.length; cm.scrollIntoView(findMatches[findIdx]); }
function replaceOne() {
  const rep = document.getElementById('replace-input').value;
  if (!findMatches.length) { doSearch(); return; }
  const m = findMatches[findIdx];
  cm.replaceRange(rep, m.from, m.to);
  doSearch();
}
function replaceAll() {
  const q = document.getElementById('find-input').value;
  const rep = document.getElementById('replace-input').value;
  if (!q) return;
  const cur = cm.getSearchCursor(q);
  while(cur.findNext()) cur.replace(rep);
  doSearch();
}
document.getElementById('find-input').addEventListener('input', doSearch);
document.getElementById('find-input').addEventListener('keydown', e=>{ if(e.key==='Enter') findNext(); if(e.key==='Escape') closeFind(); });

// ── Theme ─────────────────────────────────────────────────────────────────────
function toggleTheme() {
  const d = document.documentElement.dataset.theme === 'dark';
  document.documentElement.dataset.theme = d ? 'light' : 'dark';
  cm.setOption('theme', d ? 'default' : 'monokai');
  localStorage.setItem('we-theme', document.documentElement.dataset.theme);
}

// ── Settings ──────────────────────────────────────────────────────────────────
function openSettings() {
  document.getElementById('pat-input').value = localStorage.getItem('we-pat')||'';
  document.getElementById('settings-modal').classList.add('show');
}
function closeSettings() { document.getElementById('settings-modal').classList.remove('show'); }
function saveSettings() {
  localStorage.setItem('we-pat', document.getElementById('pat-input').value.trim());
  closeSettings();
  status('Settings saved');
}

// ── Gist sync ─────────────────────────────────────────────────────────────────
function getPAT() { return localStorage.getItem('we-pat')||''; }

async function saveToGist() {
  if (activeTab < 0) return;
  await autoSave();
  const f = files[tabs[activeTab].fileId];
  if (!f || f.isFolder) return;
  const pat = getPAT();
  if (!pat) { openSettings(); return; }
  const body = {description:'WebEditor file', public:false, files:{[f.name]:{content:f.content||' '}}};
  try {
    status('Saving to Gist...');
    let url = 'https://api.github.com/gists';
    let method = 'POST';
    if (f.gistId) { url += '/'+f.gistId; method='PATCH'; }
    const r = await fetch(url, {method, headers:{'Authorization':'token '+pat,'Content-Type':'application/json'}, body:JSON.stringify(body)});
    if (!r.ok) throw new Error(await r.text());
    const data = await r.json();
    f.gistId = data.id;
    await dbPut('files', f);
    status('Saved to Gist: ' + data.html_url);
  } catch(e) { status('Gist error: '+e.message, true); }
}

function openLoadGistModal() {
  document.getElementById('gist-input').value='';
  document.getElementById('gist-modal').classList.add('show');
  setTimeout(()=>document.getElementById('gist-input').focus(),50);
}
function closeGistModal() { document.getElementById('gist-modal').classList.remove('show'); }

async function loadGist() {
  const raw = document.getElementById('gist-input').value.trim();
  const id = raw.split('/').pop();
  if (!id) return;
  const pat = getPAT();
  try {
    status('Loading Gist...');
    const headers = pat ? {'Authorization':'token '+pat} : {};
    const r = await fetch('https://api.github.com/gists/'+id, {headers});
    if (!r.ok) throw new Error('Gist not found');
    const data = await r.json();
    for (const [fname, fdata] of Object.entries(data.files)) {
      const f = {id:uid(), name:fname, parentId:null, isFolder:false, content:fdata.content||'', gistId:id, gistFileId:fname};
      files[f.id] = f;
      await dbPut('files', f);
      renderTree();
      openFileTab(f.id);
    }
    closeGistModal();
    status('Loaded from Gist');
  } catch(e) { status('Gist error: '+e.message, true); }
}

// ── Status ────────────────────────────────────────────────────────────────────
let statusTimer;
function status(msg, err=false) {
  const el = document.getElementById('status-msg');
  el.textContent = msg;
  el.className = err ? 'err' : '';
  clearTimeout(statusTimer);
  statusTimer = setTimeout(()=>{ el.textContent=''; el.className=''; }, 4000);
}

// ── Sidebar resize ────────────────────────────────────────────────────────────
const rh = document.getElementById('rhandle');
let resizing=false, resizeX=0, resizeW=0;
rh.addEventListener('mousedown', e=>{ resizing=true; resizeX=e.clientX; resizeW=document.getElementById('sidebar').offsetWidth; rh.classList.add('dragging'); });
document.addEventListener('mousemove', e=>{ if(!resizing)return; const w=Math.max(120,Math.min(450,resizeW+(e.clientX-resizeX))); document.getElementById('sidebar').style.width=w+'px'; });
document.addEventListener('mouseup', ()=>{ resizing=false; rh.classList.remove('dragging'); });

// ── Auto-save on blur ─────────────────────────────────────────────────────────
window.addEventListener('blur', autoSave);

// ── Boot ──────────────────────────────────────────────────────────────────────
async function boot() {
  await openDB();
  const theme = localStorage.getItem('we-theme') || 'dark';
  document.documentElement.dataset.theme = theme;
  initCM();
  // load theme after CM init
  if (theme === 'light') cm.setOption('theme','default');

  const all = await dbGetAll('files');
  all.forEach(f => { files[f.id] = f; });

  const sess = await dbGet('meta','session');
  if (sess && sess.tabs) {
    sess.tabs.forEach(fid => { if(files[fid]) tabs.push({fileId:fid,dirty:false}); });
    activeTab = Math.min(sess.activeTab||0, tabs.length-1);
  }

  renderTree();
  if (tabs.length > 0) {
    loadTabContent();
  } else {
    showEmpty(true);
    renderTabs();
  }
}

boot();
</script>
